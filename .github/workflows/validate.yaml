name: Validate LLMOps lab
'on':
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 yamllint==1.38.0
          mkdir -p "$RUNNER_TEMP/lab-bin"
          curl -fsSL https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/lab-bin/kubectl"
          curl -fsSL https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256 -o "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/lab-bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/lab-bin/kubectl"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/lab-bin" kubeconform
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/lab-bin" actionlint
          echo "$RUNNER_TEMP/lab-bin" >> "$GITHUB_PATH"
      - name: Terraform
        run: |
          terraform fmt -check -recursive infra/terraform
          for root in infra/terraform/{foundation,gke-lab}; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Shell and YAML
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/{gke-up,gke-down,postgres-backup,postgres-restore,test-postgres-local,validate-gitops,mlflow-up,render-training-job}.sh
          shfmt -d -i 2 -ci scripts/{gke-up,gke-down,lab-common,postgres-backup,postgres-restore,test-postgres-local,validate-gitops,mlflow-up,mlflow-common,render-training-job}.sh
          yamllint -d '{extends: default, rules: {document-start: disable, line-length: disable}, ignore: [gitops/charts/qwen-serving/templates/]}' gitops .github/workflows
          python -m py_compile scripts/mlflow-smoke.py
          actionlint
      - name: Serving offline tests
        run: python -B -m unittest discover -s apps/qwen-baseline -p 'test_*.py'
      - name: Helm and Kubernetes schemas
        run: scripts/validate-gitops.sh
      - name: Native AMD64 MLflow image smoke test
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          image=llmops-mlflow:ci
          container=llmops-mlflow-ci
          docker buildx build --platform linux/amd64 --load -t "$image" apps/mlflow
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          docker run --rm --read-only --entrypoint python "$image" \
            -c 'import os, mlflow, psycopg2, google.cloud.storage; assert os.getuid() == os.getgid() == 10001; assert mlflow.__version__ == "3.18.0"'
          trap 'docker logs "$container" 2>/dev/null || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" --read-only --tmpfs /tmp:rw,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges -e MLFLOW_DISABLE_TELEMETRY=true \
            "$image" --host=0.0.0.0 --workers=1 --serve-artifacts \
            --backend-store-uri=sqlite:////tmp/mlflow.db --artifacts-destination=/tmp/artifacts
          for attempt in {1..30}; do
            if docker exec "$container" python -c 'from urllib.request import urlopen; urlopen("http://127.0.0.1:5000/health", timeout=2)'; then
              break
            fi
            test "$attempt" != 30
            sleep 2
          done
          docker exec -i "$container" python - http://127.0.0.1:5000 < scripts/mlflow-smoke.py
      - name: Training image and unit tests
        run: |
          set -euo pipefail
          image=llmops-iris-training:ci
          docker buildx build --platform linux/amd64 --load -t "$image" apps/training
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e MLFLOW_DISABLE_AGENT_HINT=1 \
            --entrypoint python "$image" -c 'import os; assert os.getuid() == 10001'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e MLFLOW_DISABLE_AGENT_HINT=1 \
            -v "$PWD/apps/training/test_train.py:/opt/training/test_train.py:ro" \
            --entrypoint python "$image" -m unittest test_train
