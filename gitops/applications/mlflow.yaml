apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wasdo129/gcp-platform-mlops-lab.git
    targetRevision: "@GIT_REVISION@"
    path: gitops/apps/mlflow
    kustomize:
      images:
        - "mlflow-image=@MLFLOW_IMAGE@"
      replicas:
        - name: mlflow
          count: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-platform
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 8
