apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.postgresql.cnpg.io_Cluster: |
    if obj.status and obj.status.conditions then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          return {status = "Healthy", message = condition.message}
        end
      end
    end
    return {status = "Progressing", message = obj.status and obj.status.phase or ""}
