apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      automountServiceAccountToken: false
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: mlflow-image
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --serve-artifacts
            - --artifacts-destination=gs://project-557b18ac-4cdc-4a40-b3e-ml-artifacts/mlflow
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              value: postgresql+psycopg2://mlflow-postgres-rw:5432/mlflow
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres-app
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/mlflow/postgres/ca.crt
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*,mlflow.ml-platform.svc:*,mlflow.ml-platform.svc.cluster.local:*"
            - name: MLFLOW_DISABLE_TELEMETRY
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /etc/mlflow/postgres
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: mlflow-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
