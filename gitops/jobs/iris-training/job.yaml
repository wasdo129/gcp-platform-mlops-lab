apiVersion: batch/v1
kind: Job
metadata:
  name: iris-training
  namespace: ml-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: training
          image: training-image
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "10"
            - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
              value: "0"
            - name: MLFLOW_DISABLE_AGENT_HINT
              value: "1"
            - name: MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT
              value: "true"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: BLIS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
